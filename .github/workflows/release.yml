name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 2.0.0

permissions:
  contents: write
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Install Inno Setup
        shell: pwsh
        # 6.5+ bundles Korean.isl; Build-Release also checks the language file.
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = $env:RELEASE_INPUT
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $source = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          if ($version -ne $source) { throw 'Tag/input must match source version.' }
          if (-not (Test-Path ".github/release-notes/v$version.md")) { throw 'Missing release notes.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test, and package the multilingual installer
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Record release provenance
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          ./scripts/Write-ReleaseManifest.ps1 -Version $version -AssetPaths @("artifacts/installer/eslee-auto-power-v$version-setup.exe") -VerifiedChecks @('Language-independent safe tests', 'Multilingual publish and Inno installer')

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/
            artifacts/release-manifest-*.json
            artifacts/SHA256SUMS-*.txt

      - name: Create new GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assets = @("artifacts/installer/eslee-auto-power-v$version-setup.exe", "artifacts/installer/eslee-auto-power-v$version-setup.exe.sha256", "artifacts/release-manifest-v$version.json", "artifacts/SHA256SUMS-v$version.txt")
          gh release create "v$version" --verify-tag --title "eslee Auto Power v$version" --notes-file ".github/release-notes/v$version.md" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
