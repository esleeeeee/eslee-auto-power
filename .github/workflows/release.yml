name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.0.2

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test, and package Korean and English editions
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: eslee Auto Power v${{ steps.version.outputs.version }}
          body_path: .github/release-notes/v${{ steps.version.outputs.version }}.md
          files: |
            artifacts/installer/eslee-auto-power-v${{ steps.version.outputs.version }}-ko-setup.exe
            artifacts/installer/eslee-auto-power-v${{ steps.version.outputs.version }}-ko-setup.exe.sha256
            artifacts/installer/eslee-auto-power-v${{ steps.version.outputs.version }}-en-setup.exe
            artifacts/installer/eslee-auto-power-v${{ steps.version.outputs.version }}-en-setup.exe.sha256
